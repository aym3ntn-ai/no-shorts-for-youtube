name: Firefox Release

on:
  push:
    tags:
      # Namespaced so it can't collide with the Android app's `v*.*.*` tags.
      - "firefox-v*.*.*"
  workflow_dispatch:
    inputs:
      channel:
        description: "AMO channel: unlisted (self-distributed .xpi) or listed (published on addons.mozilla.org)"
        required: true
        default: unlisted
        type: choice
        options: [unlisted, listed]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CHANNEL: ${{ inputs.channel || 'unlisted' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # web-ext sign would fail anyway, but not until after a build, and with a
      # stack trace rather than an explanation.
      - name: Check AMO credentials are configured
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
        run: |
          if [ -z "$WEB_EXT_API_KEY" ] || [ -z "$WEB_EXT_API_SECRET" ]; then
            echo "::error::WEB_EXT_API_KEY / WEB_EXT_API_SECRET are not set. Create an API"
            echo "::error::credential at https://addons.mozilla.org/developers/addon/api/key/"
            echo "::error::and add both as repository secrets."
            exit 1
          fi

      # A tag that disagrees with the manifest ships a build labelled with a
      # version it doesn't contain, and AMO rejects a version it already has.
      - name: Check the tag matches manifest.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          manifest_version=$(node -p "require('./manifest.json').version")
          tag_version="${GITHUB_REF_NAME#firefox-v}"
          if [ "$manifest_version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME implies version $tag_version, but manifest.json says $manifest_version."
            echo "::error::Bump the version in manifest.json and re-tag."
            exit 1
          fi
          echo "Releasing version $manifest_version"

      - name: Lint
        run: npx --yes web-ext@8 lint --source-dir .

      - name: Sign with AMO
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
        run: |
          npx --yes web-ext@8 sign \
            --source-dir . \
            --artifacts-dir dist \
            --channel "$CHANNEL" \
            --api-key "$WEB_EXT_API_KEY" \
            --api-secret "$WEB_EXT_API_SECRET"

      # `--channel listed` hands distribution to addons.mozilla.org and returns
      # no file to publish, so only the unlisted flow produces a release asset.
      - name: Locate the signed .xpi
        id: xpi
        run: |
          xpi=$(find dist -name "*.xpi" -print -quit)
          if [ -z "$xpi" ]; then
            if [ "$CHANNEL" = "listed" ]; then
              echo "Submitted to AMO for review; the listing is distributed from addons.mozilla.org."
              echo "found=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::web-ext reported success but produced no .xpi."
            exit 1
          fi
          echo "path=$xpi" >> "$GITHUB_OUTPUT"
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Upload signed .xpi as a build artifact
        if: steps.xpi.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: no-shorts-firefox-xpi
          path: ${{ steps.xpi.outputs.path }}

      - name: Publish GitHub release
        if: steps.xpi.outputs.found == 'true' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "${{ steps.xpi.outputs.path }}" "no-shorts-for-youtube-${GITHUB_REF_NAME}.xpi"
          gh release create "$GITHUB_REF_NAME" \
            "no-shorts-for-youtube-${GITHUB_REF_NAME}.xpi" \
            --title "Firefox ${GITHUB_REF_NAME#firefox-}" \
            --generate-notes
